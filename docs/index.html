<!-- GitHub Pages demo page -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Démo du projet</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }

    h1 {
      text-align: center;
    }

    video {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .description {
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <h1>Démo de l'application</h1>

  <video controls preload="metadata" poster="assets/poster.png">
    <source src="assets/demo.mp4" type="video/mp4" />
    Votre navigateur ne supporte pas la lecture vidéo.
  </video>

  <div class="description">
    <p>
      Cette vidéo présente une démonstration rapide de l'application :
      upload de documents, traitement, interaction avec le chatbot et affichage des résultats.
    </p>
  </div>
</body>
</html>
